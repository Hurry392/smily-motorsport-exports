name: Import SMILY source archive
on:
  push:
    branches: [main]
    paths:
      - "smily-source.zip.b64"
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Decode and unpack source
        run: |
          base64 --decode smily-source.zip.b64 > smily-source.zip
          unzip -q smily-source.zip
          cp -a smily-motorsport-exports/. .
          rm -rf smily-motorsport-exports smily-source.zip smily-source.zip.b64
      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import SMILY Motorsport Exports source"
          git push
